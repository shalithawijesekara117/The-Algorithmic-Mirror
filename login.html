<!DOCTYPE html>
<html lang="en">

<head>
    <title>The Algorithmic Mirror - Login</title>

    <link rel="stylesheet" href="Loginstyle.css">
</head>

<body>

    <main class="page">

        <!-- HEADER -->
        <header class="top-section">

            <h1>The Algorithmic Mirror - Login</h1>

        </header>


        <!-- MAIN CONTENT -->
        <section class="content">

            <div class="section-title">
                <strong>Login</strong>
            </div>

            <!-- LOGIN CARD -->
            <div class="login-card">

                <!-- small decorative line -->
                <div class="card-line"></div>

                <!-- LOGIN CONTENT -->
                <div class="login-content">

                    <h2>The Algorithmic Mirror</h2>

                    <div class="welcome">
                        WELCOME BACK
                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            EMAIL / USER NAME
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            PASSWORD
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                        >

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button class="login-button" id="loginButton">
                        Log in
                    </button>

                </div>

                <div>
                    <p class="register-text">
                        <a href="register.html">Don't have an account? Register here.</a>
                    </p>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
